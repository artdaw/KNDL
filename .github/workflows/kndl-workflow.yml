name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  node-test:
    name: kndl-memory (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: packages/kndl-memory/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: packages/kndl-memory/pnpm-lock.yaml
      - name: Install dependencies
        run: cd packages/kndl-memory && pnpm install --frozen-lockfile
      - name: Build
        run: cd packages/kndl-memory && pnpm build
      - name: Test
        run: cd packages/kndl-memory && pnpm test
